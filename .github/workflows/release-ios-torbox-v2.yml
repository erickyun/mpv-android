name: Build iOS TorBox IPA v2

on:
  push:
    branches:
      - agent/ios-torbox
    paths:
      - "ios/**"
      - ".github/workflows/release-ios-torbox-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-torbox-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract iOS source
        working-directory: ios
        run: |
          set -euo pipefail
          tar -xzf MPVTorBox-source.tar.gz

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pin MPVKit package
        working-directory: ios
        run: |
          cat > project.yml <<'YAML'
          name: MPVTorBox
          options:
            bundleIdPrefix: io.github.erickyun
            deploymentTarget:
              iOS: "15.0"
          packages:
            MPVKit:
              url: https://github.com/mpvkit/MPVKit.git
              exactVersion: 1.0.0
          targets:
            MPVTorBox:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: MPVTorBox
              info:
                path: MPVTorBox/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: io.github.erickyun.MPVTorBox
                  PRODUCT_NAME: MPVTorBox
                  SWIFT_VERSION: 5.0
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGN_STYLE: Automatic
                  ENABLE_USER_SCRIPT_SANDBOXING: NO
              dependencies:
                - package: MPVKit
                  product: MPVKit-GPL
          schemes:
            MPVTorBox:
              build:
                targets:
                  MPVTorBox: all
              run:
                config: Debug
              archive:
                config: Release
          YAML

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project MPVTorBox.xcodeproj

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/build/SourcePackages
          key: ios-mpvkit-1.0.0-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ios-mpvkit-1.0.0-${{ runner.os }}-

      - name: Resolve Swift packages with retries
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p build/SourcePackages
          for attempt in 1 2 3; do
            echo "Swift package resolution attempt ${attempt}/3"
            if xcodebuild \
              -resolvePackageDependencies \
              -project MPVTorBox.xcodeproj \
              -scheme MPVTorBox \
              -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
              -skipPackagePluginValidation; then
              exit 0
            fi
            rm -rf "$PWD/build/SourcePackages/repositories" \
                   "$PWD/build/SourcePackages/checkouts" \
                   "$PWD/build/SourcePackages/artifacts"
            sleep $((attempt * 10))
          done
          echo "Swift package resolution failed after three attempts" >&2
          exit 1

      - name: Build device app without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MPVTorBox.xcodeproj \
            -scheme MPVTorBox \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload release
          mkdir -p Payload release
          cp -R "$APP_PATH" Payload/MPVTorBox.app
          /usr/bin/zip -qry release/MPVTorBox-iOS-unsigned.ipa Payload
          shasum -a 256 release/MPVTorBox-iOS-unsigned.ipa > release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPVTorBox-iOS-unsigned
          path: |
            ios/release/MPVTorBox-iOS-unsigned.ipa
            ios/release/SHA256SUMS.txt
            ios/xcodebuild.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ios-torbox-${{ github.run_number }}-v2
        run: |
          gh release create "$TAG" \
            ios/release/MPVTorBox-iOS-unsigned.ipa \
            ios/release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "MPV TorBox iOS ${GITHUB_RUN_NUMBER} v2" \
            --notes "Unsigned iPhone/iPad IPA with TorBox, TorrServer fallback, magnet URL handling, and MPVKit playback. Sign with AltStore, SideStore, Sideloadly, TrollStore, or your own Apple certificate." \
            --prerelease
