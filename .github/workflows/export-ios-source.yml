name: Export iOS source archive

on:
  push:
    branches:
      - agent/ios-torbox
    paths:
      - ".github/workflows/export-ios-source.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Upload iOS source archive
        uses: actions/upload-artifact@v4
        with:
          name: MPVTorBox-source
          path: ios/MPVTorBox-source.tar.gz
          if-no-files-found: error
          retention-days: 1
