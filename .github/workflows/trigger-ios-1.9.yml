name: Trigger MPV iOS 1.9 build

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/trigger-ios-1.9.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch WebKit-only iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/actions/workflows/328737318/dispatches \
            -f ref='agent/ios-torbox'
