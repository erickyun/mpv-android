name: Inspect iOS Source

on:
  push:
    branches:
      - agent/ios-torbox
    paths:
      - ".github/workflows/inspect-ios-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          set -euo pipefail
          mkdir -p inspect
          cat .github/source/ios-player-v3.part* > inspect/source.tar.xz.b64
          base64 -d inspect/source.tar.xz.b64 > inspect/source.tar.xz
          xz -t inspect/source.tar.xz
          tar -xJf inspect/source.tar.xz -C inspect
          rm inspect/source.tar.xz inspect/source.tar.xz.b64
      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: MPVTorBox-extracted-source
          path: inspect/MPVTorBox
          retention-days: 1
