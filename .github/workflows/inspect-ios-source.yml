name: Inspect patched iOS source

on:
  push:
    branches:
      - agent/ios-torbox
    paths:
      - ".github/workflows/inspect-ios-source.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct patched source
        working-directory: ios
        run: |
          set -euo pipefail
          cat ../.github/source/ios-player-v3.part* > MPVTorBox-source.tar.xz.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64
          encoded = Path('MPVTorBox-source.tar.xz.b64').read_text().strip()
          Path('MPVTorBox-source.tar.xz').write_bytes(base64.b64decode(encoded, validate=True))
          PY
          tar -xJf MPVTorBox-source.tar.xz
          python3 ../.github/source/fix-ios-swift6.py
          python3 ../.github/source/fix-ios-fullscreen-install.py
          python3 ../.github/source/fix-ios-launch-build-setting.py
          python3 ../.github/source/fix-ios-ytdlp-webkit-v6.py
          python3 ../.github/source/fix-ios-webkit-frameworks.py
          python3 ../.github/source/fix-ios-ytdlp-mainthread-logs-v7.py
          python3 ../.github/source/fix-ios-ytdlp-hybrid-v8.py
          python3 ../.github/source/fix-ios-ytdlp-runtime-probe-v9.py
      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: patched-ios-source
          path: |
            ios/MPVTorBox
            ios/project.yml
          retention-days: 1
