name: Build iOS TorBox yt-dlp IPA

on:
  push:
    branches:
      - agent/ios-torbox
    paths:
      - "ios/**"
      - ".github/source/ios-player-v3.part*"
      - ".github/workflows/release-ios-torbox.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-torbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract and verify iOS source
        working-directory: ios
        run: |
          set -euo pipefail
          cat ../.github/source/ios-player-v3.part* > MPVTorBox-source.tar.xz.b64
          test "$(wc -c < MPVTorBox-source.tar.xz.b64 | tr -d ' ')" = "27096"
          python3 - <<'PY'
          from pathlib import Path
          import base64
          encoded = Path('MPVTorBox-source.tar.xz.b64').read_text().strip()
          Path('MPVTorBox-source.tar.xz').write_bytes(base64.b64decode(encoded, validate=True))
          PY
          xz -t MPVTorBox-source.tar.xz
          tar -xJf MPVTorBox-source.tar.xz
          test -f MPVTorBox/Views/PlayerScreen.swift
          test -f MPVTorBox/Player/MPVMetalViewController.swift
          grep -q 'profile=high-quality' MPVTorBox/Utilities/MPVConfigManager.swift

      - name: Generate official MPV app icon
        working-directory: ios
        run: |
          mkdir -p MPVTorBox/Assets.xcassets/AppIcon.appiconset
          python3 - <<'PY'
          import struct, zlib
          width = height = 1024
          colors = {
              'bg': (30, 15, 31),
              'outer': (229, 229, 229),
              'purple': (103, 33, 104),
              'dark': (66, 1, 67),
              'inner': (221, 219, 221),
              'play': (105, 31, 105),
          }
          def inside_circle(px, py, cx, cy, r):
              return (px - cx) ** 2 + (py - cy) ** 2 <= r * r
          def inside_triangle(px, py, a, b, c):
              def sign(p1, p2, p3):
                  return (p1[0]-p3[0])*(p2[1]-p3[1])-(p2[0]-p3[0])*(p1[1]-p3[1])
              p=(px,py)
              d1,d2,d3=sign(p,a,b),sign(p,b,c),sign(p,c,a)
              return not ((d1 < 0 or d2 < 0 or d3 < 0) and (d1 > 0 or d2 > 0 or d3 > 0))
          rows=[]
          for y in range(height):
              row=bytearray()
              for x in range(width):
                  samples=[]
                  for sy in (0.25,0.75):
                      for sx in (0.25,0.75):
                          px,py=x+sx,y+sy
                          color=colors['bg']
                          if inside_circle(px,py,512,512,408): color=colors['outer']
                          if inside_circle(px,py,523,500,379): color=colors['purple']
                          if inside_circle(px,py,545,475,292): color=colors['dark']
                          if inside_circle(px,py,505,514,188): color=colors['inner']
                          if inside_triangle(px,py,(457,425),(457,603),(606,512)): color=colors['play']
                          samples.append(color)
                  rgb=tuple(sum(c[i] for c in samples)//len(samples) for i in range(3))
                  row.extend((*rgb,255))
              rows.append(b'\x00'+bytes(row))
          raw=b''.join(rows)
          def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
          png=(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',width,height,8,6,0,0,0))+
               chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b''))
          open('MPVTorBox/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png','wb').write(png)
          PY
          cat > MPVTorBox/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project MPVTorBox.xcodeproj \
            -scheme MPVTorBox

      - name: Build device app without signing
        id: ios_build
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MPVTorBox.xcodeproj \
            -scheme MPVTorBox \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Print compiler errors
        if: always()
        working-directory: ios
        run: |
          if test -f xcodebuild.log; then
            echo "## Compiler diagnostics" >> "$GITHUB_STEP_SUMMARY"
            grep -nE "(^|[[:space:]])(error:|fatal error:)" xcodebuild.log | tail -160 | tee compiler-errors.txt || true
            sed -n '1,240p' compiler-errors.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MPVTorBox-iOS-build-log
          path: |
            ios/xcodebuild.log
            ios/compiler-errors.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Stop after failed build
        if: steps.ios_build.outcome != 'success'
        run: exit 1

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload release
          mkdir -p Payload release
          cp -R "$APP_PATH" Payload/MPVTorBox.app
          /usr/bin/zip -qry release/MPVTorBox-iOS-unsigned.ipa Payload
          shasum -a 256 release/MPVTorBox-iOS-unsigned.ipa > release/SHA256SUMS.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPVTorBox-iOS-unsigned
          path: |
            ios/release/MPVTorBox-iOS-unsigned.ipa
            ios/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ios-torbox-${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            ios/release/MPVTorBox-iOS-unsigned.ipa \
            ios/release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "MPV TorBox iOS ${GITHUB_RUN_NUMBER}" \
            --notes "Major mpv-android-style iOS player update: edge-to-edge landscape playback, seek slider and gestures, video/audio/subtitle track selection, external subtitles, three-level frame-drop statistics, local files, playback speed and scaling controls, editable mpv.conf/input.conf with profile=high-quality, local yt-dlp, TorBox, TorrServer fallback, and the official MPV logo icon. Requires iOS 16+. Unsigned IPA." \
            --prerelease
