name: Build iOS TorBox yt-dlp IPA

on:
  push:
    branches:
      - agent/ios-torbox
    paths:
      - "ios/**"
      - ".github/workflows/release-ios-torbox.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-torbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract iOS source
        working-directory: ios
        run: tar -xzf MPVTorBox-source.tar.gz

      - name: Improve yt-dlp stream selection
        working-directory: ios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('MPVTorBox/YTDLPService.swift')
          text = path.read_text()
          declaration = 'let (formats, _) = try await youtubeDL.extractInfo(url: url)'
          filter_line = 'let progressive = formats.filter { format in'
          if declaration not in text or filter_line not in text:
              raise SystemExit('Expected yt-dlp resolver source was not found')
          text = text.replace(
              declaration,
              'let (selectedFormats, info) = try await youtubeDL.extractInfo(url: url)',
              1,
          )
          text = text.replace(
              filter_line,
              'var formats = info.formats\n        formats.append(contentsOf: selectedFormats)\n\n        let progressive = formats.filter { format in',
              1,
          )
          path.write_text(text)
          PY

      - name: Generate iOS app icon
        working-directory: ios
        run: |
          mkdir -p MPVTorBox/Assets.xcassets/AppIcon.appiconset
          python3 - <<'PY'
          import struct, zlib
          width = height = 1024
          rows = []
          for y in range(height):
              row = bytearray()
              for x in range(width):
                  r, g, b = 18, 28, 48
                  if 320 <= x <= 420 and 300 <= y <= 724:
                      r, g, b = 255, 255, 255
                  if 420 < x <= 730 and abs(y - 512) <= (x - 420) * 0.68:
                      r, g, b = 255, 255, 255
                  if (x - 770) ** 2 + (y - 265) ** 2 <= 52 ** 2:
                      r, g, b = 82, 224, 182
                  row.extend((r, g, b, 255))
              rows.append(b'\x00' + bytes(row))
          raw = b''.join(rows)
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          open('MPVTorBox/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png', 'wb').write(png)
          PY
          cat > MPVTorBox/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project MPVTorBox.xcodeproj \
            -scheme MPVTorBox

      - name: Build device app without signing
        id: ios_build
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MPVTorBox.xcodeproj \
            -scheme MPVTorBox \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Print compiler errors
        if: always()
        working-directory: ios
        run: |
          if test -f xcodebuild.log; then
            echo "## Compiler diagnostics" >> "$GITHUB_STEP_SUMMARY"
            grep -nE "(^|[[:space:]])(error:|fatal error:)" xcodebuild.log | tail -100 | tee compiler-errors.txt || true
            sed -n '1,200p' compiler-errors.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MPVTorBox-iOS-build-log
          path: |
            ios/xcodebuild.log
            ios/compiler-errors.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Stop after failed build
        if: steps.ios_build.outcome != 'success'
        run: exit 1

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload release
          mkdir -p Payload release
          cp -R "$APP_PATH" Payload/MPVTorBox.app
          /usr/bin/zip -qry release/MPVTorBox-iOS-unsigned.ipa Payload
          shasum -a 256 release/MPVTorBox-iOS-unsigned.ipa > release/SHA256SUMS.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPVTorBox-iOS-unsigned
          path: |
            ios/release/MPVTorBox-iOS-unsigned.ipa
            ios/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ios-torbox-${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            ios/release/MPVTorBox-iOS-unsigned.ipa \
            ios/release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "MPV TorBox yt-dlp iOS ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned iPhone/iPad IPA with local yt-dlp extraction, TorBox, TorrServer fallback, magnet URL handling, and MPVKit playback. Requires iOS 16+. Sign with AltStore, SideStore, Sideloadly, TrollStore, or your own Apple certificate." \
            --prerelease
