name: Build MPV iOS yt-dlp IPA

on:
  push:
    branches:
      - agent/ios-torbox
    paths:
      - "ios/**"
      - ".github/source/ios-player-v3.part*"
      - ".github/source/fix-ios-swift6.py"
      - ".github/source/fix-ios-fullscreen-install.py"
      - ".github/source/fix-ios-launch-build-setting.py"
      - ".github/source/fix-ios-player-ux-v2.py"
      - ".github/source/generate-mpv-icon.py"
      - ".github/workflows/release-ios-torbox.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-torbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned MPV iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract and verify iOS source
        working-directory: ios
        run: |
          set -euo pipefail
          cat ../.github/source/ios-player-v3.part* > MPVTorBox-source.tar.xz.b64
          test "$(wc -c < MPVTorBox-source.tar.xz.b64 | tr -d ' ')" = "27096"
          python3 - <<'PY'
          from pathlib import Path
          import base64
          encoded = Path('MPVTorBox-source.tar.xz.b64').read_text().strip()
          Path('MPVTorBox-source.tar.xz').write_bytes(base64.b64decode(encoded, validate=True))
          PY
          xz -t MPVTorBox-source.tar.xz
          tar -xJf MPVTorBox-source.tar.xz
          test -f MPVTorBox/Views/PlayerScreen.swift
          test -f MPVTorBox/Player/MPVMetalViewController.swift
          grep -q 'profile=high-quality' MPVTorBox/Utilities/MPVConfigManager.swift

      - name: Apply Swift 6 compatibility fixes
        working-directory: ios
        run: python3 ../.github/source/fix-ios-swift6.py

      - name: Apply full-screen, reset, and player UX fixes
        working-directory: ios
        run: |
          python3 ../.github/source/fix-ios-fullscreen-install.py
          python3 ../.github/source/fix-ios-launch-build-setting.py
          test -f MPVTorBox/LaunchScreen.storyboard
          grep -q 'UILaunchStoryboardName' MPVTorBox/Info.plist
          grep -q 'INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen' project.yml
          grep -q 'installation_marker_v1' MPVTorBox/AppSettings.swift
          grep -q 'refreshVideoSurface' MPVTorBox/Player/MPVMetalViewController.swift
          grep -q 'forOpeningContentTypes: \[.item\], asCopy: true' MPVTorBox/Views/DocumentPicker.swift
          grep -q 'statsLevel == 0 ? 3 : 0' MPVTorBox/Views/PlayerScreen.swift
          grep -q 'Starting built-in yt-dlp' MPVTorBox/YTDLPService.swift

      - name: Generate official MPV app icon
        working-directory: ios
        run: python3 ../.github/source/generate-mpv-icon.py

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project MPVTorBox.xcodeproj \
            -scheme MPVTorBox

      - name: Build device app without signing
        id: ios_build
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MPVTorBox.xcodeproj \
            -scheme MPVTorBox \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Print compiler errors
        if: always()
        working-directory: ios
        run: |
          if test -f xcodebuild.log; then
            echo "## Compiler diagnostics" >> "$GITHUB_STEP_SUMMARY"
            grep -nE "(^|[[:space:]])(error:|fatal error:)" xcodebuild.log | tail -160 | tee compiler-errors.txt || true
            sed -n '1,240p' compiler-errors.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MPV-iOS-build-log
          path: |
            ios/xcodebuild.log
            ios/compiler-errors.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Stop after failed build
        if: steps.ios_build.outcome != 'success'
        run: exit 1

      - name: Package and verify unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"

          grep -qE 'CompileStoryboard .*/MPVTorBox/LaunchScreen\.storyboard' xcodebuild.log
          grep -qE -- '--link .*/MPVTorBox\.app .*/LaunchScreen\.storyboardc' xcodebuild.log

          # Pin the values in the actual installable bundle. Xcode's processed
          # plist can otherwise omit the source display name/version keys.
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib
          import sys

          path = sys.argv[1]
          with open(path, 'rb') as stream:
              info = plistlib.load(stream)

          info.pop('UILaunchScreen', None)
          info['UILaunchStoryboardName'] = 'LaunchScreen'
          info['CFBundleDisplayName'] = 'MPV'
          info['CFBundleName'] = 'MPV'
          info['CFBundleShortVersionString'] = '1.2.0'
          info['CFBundleVersion'] = '12'

          with open(path, 'wb') as stream:
              plistlib.dump(info, stream, fmt=plistlib.FMT_BINARY, sort_keys=False)

          with open(path, 'rb') as stream:
              verified = plistlib.load(stream)
          expected = {
              'UILaunchStoryboardName': 'LaunchScreen',
              'CFBundleDisplayName': 'MPV',
              'CFBundleName': 'MPV',
              'CFBundleShortVersionString': '1.2.0',
              'CFBundleVersion': '12',
          }
          for key, value in expected.items():
              if verified.get(key) != value:
                  raise SystemExit(f'{key}={verified.get(key)!r}, expected {value!r}')
          print('Pinned final app identity:', expected)
          PY

          rm -rf Payload release
          mkdir -p Payload release
          cp -R "$APP_PATH" Payload/MPV.app
          /usr/bin/zip -qry release/MPV-iOS-unsigned.ipa Payload

          # Verify the final IPA, not an intermediate build directory.
          python3 - release/MPV-iOS-unsigned.ipa <<'PY'
          import plistlib
          import sys
          import zipfile

          ipa = sys.argv[1]
          expected_path = 'Payload/MPV.app/Info.plist'
          expected_values = {
              'UILaunchStoryboardName': 'LaunchScreen',
              'CFBundleDisplayName': 'MPV',
              'CFBundleName': 'MPV',
              'CFBundleShortVersionString': '1.2.0',
              'CFBundleVersion': '12',
          }
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              if expected_path not in names:
                  raise SystemExit(f'{expected_path} is missing from the IPA')
              info = plistlib.loads(archive.read(expected_path))
              for key, value in expected_values.items():
                  if info.get(key) != value:
                      raise SystemExit(f'IPA {key}={info.get(key)!r}, expected {value!r}')
              launch_entries = [name for name in names if 'launchscreen' in name.lower()]
              if not launch_entries:
                  raise SystemExit('Compiled LaunchScreen is missing from the IPA')
              print('Verified final IPA identity:', expected_values)
              print('LaunchScreen-related IPA entries:')
              for name in launch_entries:
                  print(f'  {name}')
          PY

          shasum -a 256 release/MPV-iOS-unsigned.ipa > release/SHA256SUMS.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPV-iOS-unsigned
          path: |
            ios/release/MPV-iOS-unsigned.ipa
            ios/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ios-torbox-${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            ios/release/MPV-iOS-unsigned.ipa \
            ios/release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "MPV iOS ${GITHUB_RUN_NUMBER}" \
            --notes "MPV 1.2.0 (build 12). Fixes immediate portrait/landscape Metal video resizing, reveals player controls with one tap, opens local and cloud-provider files through the iOS document picker, combines playback statistics into one complete panel, explains the bundled yt-dlp workflow, and uses MPV as the visible app name. Also retains TorBox, TorrServer, tracks, MPV config files, the compiled LaunchScreen, and fresh-install settings cleanup. Requires iOS 16+. Unsigned IPA." \
            --prerelease
